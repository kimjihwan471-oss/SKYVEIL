<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKYVEIL 크루 면접 신청</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--zenith:#0f2a55;--ink:#1b3358;--mist:#f5faff;--horizon:#bfd9f2;--sky:#6fa8e0;--dawn:#ffd6b0;--line:rgba(15,42,85,.16);--ok:#1f8a5b;--bad:#c0392b}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:"Noto Sans KR",system-ui,sans-serif;color:var(--ink);line-height:1.7;background:linear-gradient(180deg,#8fbfee 0,#cfe5f8 38%,#f5faff 70%) fixed;min-height:100vh}
a{color:inherit}
:focus-visible{outline:2px solid var(--zenith);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
header.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0}
.logo{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:24px;letter-spacing:.32em;text-decoration:none;color:var(--zenith)}
.link{background:none;border:0;font:inherit;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:4px;color:var(--zenith)}
.hero{position:relative;padding:9vh 0 7vh;overflow:hidden}
.hero h1{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:clamp(46px,9.5vw,118px);line-height:.98;color:var(--zenith);letter-spacing:.01em}
.hero h1 i{font-weight:500}
.hero p{margin-top:26px;max-width:30em;font-size:17px}
.star{position:absolute;right:4%;top:6vh;width:clamp(90px,16vw,190px);opacity:.9;animation:rise 1.6s ease-out both}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:.9}}
@media (prefers-reduced-motion:reduce){.star{animation:none}}
.cta{display:inline-block;margin-top:30px;padding:15px 34px;border-radius:999px;background:var(--zenith);color:#fff;text-decoration:none;font-weight:500}
.roles{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 56px}
