<div id="adminLogin">
  <h2>SKYVEIL 관리자</h2>
  <p>관리자 비밀번호를 입력해 주세요.</p>

  <form id="adminLoginForm">
    <input
      id="adminPassword"
      type="password"
      placeholder="관리자 비밀번호"
      required
    />
    <button type="submit">관리자 로그인</button>
    <p id="adminLoginMessage"></p>
  </form>
</div>

<div id="adminPanel" hidden>
  <h2>관리자 모드</h2>
  <p>관리자 로그인에 성공했습니다.</p>
  <button id="adminLogout" type="button">로그아웃</button>

  <!-- 기존 지원서 관리 화면을 이 안에 배치하세요. -->
</div>

<script>
  // 테스트용입니다. 실제 서비스에서는 비밀번호를 HTML에 저장하지 마세요.
  const ADMIN_PASSWORD = "원하는비밀번호";

  const loginForm = document.getElementById("adminLoginForm");
  const loginBox = document.getElementById("adminLogin");
  const adminPanel = document.getElementById("adminPanel");
  const loginMessage = document.getElementById("adminLoginMessage");

  loginForm.addEventListener("submit", function (event) {
    event.preventDefault();

    const enteredPassword =
      document.getElementById("adminPassword").value;

    if (enteredPassword === ADMIN_PASSWORD) {
      loginBox.hidden = true;
      adminPanel.hidden = false;
      loginMessage.textContent = "";
      document.getElementById("adminPassword").value = "";
    } else {
      loginMessage.textContent = "비밀번호가 올바르지 않습니다.";
    }
  });

  document.getElementById("adminLogout").addEventListener("click", function () {
    adminPanel.hidden = true;
    loginBox.hidden = false;
    loginForm.reset();
  });
</script>
